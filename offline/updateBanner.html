<!-- Bar at the bottom of the page, shown when a new version of the app is ready (offline/offlineController.js adds .open) -->
<div id="updateBanner" class="update-banner">
  <span>A new version of Pro Timer is ready.</span>
  <!-- Switches to the new version now -->
  <button id="updateReload">Reload</button>
  <!-- Hides the bar; the new version loads the next time the app is opened -->
  <button id="updateLater">Later</button>
</div>
