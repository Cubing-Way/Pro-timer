<!-- Timer block: the time, the event extras next to it, and the button bar under it (timer/timerController.js) -->
<div class="timer-block">
  <!-- Row that holds the timer and, depending on the event, the FMC panel or the typing box -->
  <div id="timerins">
    <!-- The running time -->
    <div id="timer">0.00</div>
    <include src="../event/fmcPanel.html"></include>
    <include src="../timeTyping/typingBox.html"></include>
  </div>

  <!-- Buttons under the timer; event/eventLayout.js shows the ones the current event uses -->
  <div class="penalty-bar">
    <!-- Penalties for the last solve: none, +2 (each click adds 2 more), DNF, delete (topbar/topbarController.js) -->
    <button id="penaltyOkBtn">OK</button>
    <button id="penaltyPlus2Btn">+2</button>
    <button id="penaltyDnfBtn">DNF</button>
    <button id="removeLastBtn">X</button>
    <!-- Multi-Blind: opens the list of scrambles (event/mbldModal.html) -->
    <button id="open-mbld-modal">View Scrambles</button>
    <!-- FMC and Multi-Blind: opens the timer warnings pop-up (event/warningsModal.html) -->
    <button id="openConfig">Timer Warnings</button>
    <!-- FMC and Multi-Blind: starts and stops the 1-hour attempt countdown (timer/countdownTimer.js) -->
    <button id="countdown">Start attempt</button>
    <!-- FMC and Multi-Blind: saves the result (event/eventController.js) -->
    <button id="submit-moves">Submit solution</button>
  </div>
</div>
