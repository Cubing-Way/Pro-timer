<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Timer v1</title>
    <!-- Imports every folder's CSS (main/style.css lists them) -->
    <link rel="stylesheet" href="./main/style.css">
</head>
<body>
    <!-- Page skeleton: each <include> is swapped for that file's HTML by the plugin in vite.config.js -->

    <include src="./topbar/topbar.html"></include>

    <!-- 3-column grid: history | timer | stats (main/layout.css) -->
    <div class="app-layout">
        <include src="./render/historySidebar.html"></include>
        <include src="./render/statsSidebar.html"></include>

        <!-- Middle column -->
        <main class="main-layout">
            <div class="main-center">
                <!-- Invisible layer that catches touches to start and stop the timer on phones (timer/timerController.js) -->
                <div id="touchOverlay"></div>
                <include src="./scramble/scrambleText.html"></include>
                <include src="./timer/timerBlock.html"></include>
                <include src="./render/averageFooter.html"></include>
                <include src="./scramble/phoneVisualizer.html"></include>
            </div>
        </main>
    </div>

    <include src="./scramble/desktopVisualizer.html"></include>

    <!-- Pop-ups and full-screen pages, hidden until opened -->
    <include src="./modal/detailsModal.html"></include>
    <include src="./stats/statsPage.html"></include>
    <include src="./settings/settingsPanel.html"></include>
    <include src="./event/mbldModal.html"></include>
    <include src="./event/warningsModal.html"></include>

    <!-- Entry script: loads every folder's controller, then shows the first scramble -->
    <script type="module" src="./main/mainController.js"></script>
</body>
</html>
