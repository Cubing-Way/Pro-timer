<!-- Settings pop-up, opened by the gear button; settings/settingsController.js loads, applies and saves every value -->
<div id="settingsOverlay" class="overlay">
  <div id="settingsPanel" class="settings-panel">

    <!-- Title and close button -->
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="closeSettings">✖</button>
    </div>

    <div class="settings-body">

      <!-- Timer options; event/eventLayout.js hides this section (by its timerOpt class) in untimed events -->
      <div class="settings-section timerOpt">
        <div class="section-title">Timer Options</div>

        <!-- WCA (15 s with +2 / DNF), free (no limit) or no inspection -->
        <div class="setting-row">
          <label>Inspection type</label>
          <div class="setting-control">
            <select id="inspection-type">
              <option value="WCA" selected>WCA</option>
              <option value="Free">Free</option>
              <option value="None">None</option>
            </select>
          </div>
        </div>

        <!-- How long the start key must be held before the timer is ready -->
        <div class="setting-row">
          <label>Delay flag</label>
          <div class="setting-control">
            <select id="delay-flag">
              <option value="WCA" selected>0.3s (WCA)</option>
              <option value="None">None</option>
            </select>
          </div>
        </div>

        <!-- Time with the timer or type the times in (timeTyping/) -->
        <div class="setting-row">
          <label>Time insertion</label>
          <div class="setting-control">
            <select id="time-insertion">
              <option value="Timer" selected>Timer</option>
              <option value="Typing">Typing</option>
            </select>
          </div>
        </div>
      </div>

      <!-- These rows sit outside the Timer Options section, so they stay visible in untimed events -->

      <!-- How many phases one solve is split into (timer/timerPhases.js) -->
      <div class="setting-row">
        <label>Timer Phases</label>
        <div class="setting-control">
          <input type="number" id="phase-count" min="1" max="10" step="1" />
        </div>
      </div>

      <!-- Show the running time, or hide it until the solve ends -->
      <div class="setting-row">
        <label>Timer display</label>
        <div class="setting-control">
          <select id="timer-display">
            <option value="Show" selected>Always show</option>
            <option value="Hide">Hide while solving</option>
          </select>
        </div>
      </div>

      <!-- How many decimals the timer shows; solves are still saved with 2, like the WCA -->
      <div class="setting-row">
        <label>Timer decimals</label>
        <div class="setting-control">
          <select id="timer-decimals">
            <option value="1">1 decimal (10.1)</option>
            <option value="2" selected>2 decimals (10.12)</option>
            <option value="3">3 decimals (10.123)</option>
          </select>
        </div>
      </div>

      <!-- Inspection starts when the key is pressed, or when it is released -->
      <div class="setting-row">
        <label>Inspection start</label>
        <div class="setting-control">
          <select id="inspection-start">
            <option value="press-start" selected>Press start</option>
            <option value="press-end">Press end</option>
          </select>
        </div>
      </div>

      <!-- Colors: each select picks a theme class from settings/textThemes.css or settings/backgroundThemes.css -->
      <div class="settings-section">
        <div class="section-title">Color</div>

        <!-- Color of the times and numbers (--times-color) -->
        <div class="setting-row">
          <label>Main text</label>
          <div class="setting-control">
            <select id="times-color">
              <include src="./textColorOptions.html"></include>
            </select>
          </div>
        </div>

        <!-- Color of the other text (a .theme-text-* class on <body>) -->
        <div class="setting-row">
          <label>Secondary Text</label>
          <div class="setting-control">
            <select id="text-color">
              <include src="./textColorOptions.html"></include>
            </select>
          </div>
        </div>

        <!-- Page background (--bg-main) -->
        <div class="setting-row">
          <label>Main background</label>
          <div class="setting-control">
            <select id="main-background">
              <include src="./backgroundOptions.html"></include>
            </select>
          </div>
        </div>

        <!-- Top bar, left sidebar and settings rows (--bg-tertiary) -->
        <div class="setting-row">
          <label>Secondary background</label>
          <div class="setting-control">
            <select id="secondary-background">
              <include src="./backgroundOptions.html"></include>
            </select>
          </div>
        </div>

        <!-- Pop-ups and the stats table header (--bg-secondary) -->
        <div class="setting-row">
          <label>Tertiary background</label>
          <div class="setting-control">
            <select id="tertiary-background">
              <include src="./backgroundOptions.html"></include>
            </select>
          </div>
        </div>

        <!-- Buttons, selects and most borders (--border-main) -->
        <div class="setting-row">
          <label>Buttons background</label>
          <div class="setting-control">
            <select id="buttons-background">
              <include src="./backgroundOptions.html"></include>
            </select>
          </div>
        </div>
      </div>

      <!-- Layout: each select shows or hides a part of the page (settings/layout.js) -->
      <div class="settings-section">
        <div class="section-title">Layout</div>

        <!-- Desktop scramble picture -->
        <div class="setting-row">
          <label>Scramble visualizer</label>
          <div class="setting-control">
            <select id="toggle-scramble-visualizer">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Right sidebar; the row is hidden on phones (#pc1), which never show it -->
        <div class="setting-row" id="pc1">
          <label>Statistics</label>
          <div class="setting-control">
            <select id="toggle-statistics">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Left sidebar; the row is hidden on phones (#pc2), which never show it -->
        <div class="setting-row" id="pc2">
          <label>Session History</label>
          <div class="setting-control">
            <select id="toggle-session-history">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Scramble text above the timer -->
        <div class="setting-row">
          <label>Scramble text</label>
          <div class="setting-control">
            <select id="toggle-scramble-text">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Buttons under the timer -->
        <div class="setting-row">
          <label>Penalty bar</label>
          <div class="setting-control">
            <select id="toggle-penalty-bar">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Footer under the timer -->
        <div class="setting-row">
          <label>Average preview</label>
          <div class="setting-control">
            <select id="toggle-average-preview">
              <option value="show">Display</option>
              <option value="hide">None</option>
            </select>
          </div>
        </div>

        <!-- Difference to the previous solve beside the timer; off until turned on -->
        <div class="setting-row">
          <label>Time difference</label>
          <div class="setting-control">
            <select id="toggle-time-diff">
              <option value="show">Display</option>
              <option value="hide" selected>None</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Data: back up every session to a file, or load solves from other timers' files or from the WCA website (importExport/) -->
      <div class="settings-section">
        <div class="section-title">Data</div>

        <!-- Saved on every solve timed or typed here as its "done at"; the placeholder shows what's used when it's empty (settings/settingsController.js) -->
        <div class="setting-row import-row">
          <label for="deviceNameInput">This device
            <span class="setting-hint">Saved on each solve as where it was done</span>
          </label>
          <div class="setting-control">
            <input type="text" id="deviceNameInput" class="device-name-input" maxlength="30" autocomplete="off" />
          </div>
        </div>

        <div class="setting-row">
          <label>Export solves</label>
          <div class="setting-control">
            <button id="exportSolvesBtn">Export</button>
          </div>
        </div>

        <div class="setting-row import-row">
          <!-- The hint lists the files Pro Timer can read -->
          <label>Import solves
            <span class="setting-hint">Pro Timer, csTimer, CubeDesk, Twisty Timer, a competition's WCIF (WCA Live) or a list of times</span>
          </label>
          <div class="setting-control">
            <!-- Opens the file picker; what to import and where is asked in the import pop-up -->
            <button id="importSolvesBtn">Import</button>
            <input type="file" id="importFileInput" accept=".json,.txt,.csv" hidden />
          </div>
        </div>

        <!-- Official results: the WCA ID is remembered, and Sync adds new results to the "WCA <event>" sessions (also once a day on load) -->
        <div class="setting-row import-row">
          <label for="wcaIdInput">WCA sync
            <span class="setting-hint">Keeps your competition results up to date, by WCA ID</span>
            <!-- When it last synced and how many solves it added, or what went wrong; written by the controller -->
            <span id="wcaSyncStatus" class="setting-hint"></span>
          </label>
          <div class="setting-control">
            <input type="text" id="wcaIdInput" class="wca-id-input" placeholder="2009ZEMD01" maxlength="10" autocomplete="off" spellcheck="false" />
            <button id="wcaSyncBtn">Sync</button>
          </div>
        </div>

        <!-- Pop-up after picking a file: which of its sessions to import, and where they go (importExport/importExportController.js) -->
        <dialog id="importDialog" class="import-dialog">
          <form method="dialog">
            <h3>Import solves</h3>
            <!-- How many sessions and solves the file has, written by the controller -->
            <p id="importInfo"></p>

            <!-- Whose results: one option per competitor; only shown for a competition file (WCIF), which has everyone's -->
            <div id="importCompetitorRow" class="import-dialog-field" hidden>
              <label for="importCompetitorSelect">Competitor</label>
              <div class="setting-control">
                <select id="importCompetitorSelect"></select>
              </div>
            </div>

            <!-- Which sessions: "All sessions", then one option per session in the file; hidden when the file has only one -->
            <div id="importSessionRow" class="import-dialog-field">
              <label for="importSessionSelect">Sessions</label>
              <div class="setting-control">
                <select id="importSessionSelect"></select>
              </div>
            </div>

            <!-- Where the solves go: new sessions, or the session in use (the controller adds its name) -->
            <div class="import-dialog-field">
              <label for="importTarget">Import into</label>
              <div class="setting-control">
                <select id="importTarget">
                  <option value="new" selected>New sessions</option>
                  <option value="current">Current session</option>
                </select>
              </div>
            </div>

            <!-- The button's value becomes the dialog's returnValue when it closes it -->
            <div class="setting-control import-dialog-buttons">
              <button value="cancel">Cancel</button>
              <button value="import">Import</button>
            </div>
          </form>
        </dialog>
      </div>
      
    </div>
  </div>
</div>
